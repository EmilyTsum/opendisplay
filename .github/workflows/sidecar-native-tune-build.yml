name: Sidecar Native Tune Build
on:
  push:
    branches: [research/os-integration-private-api]
    paths:
      - 'tools/os-integration-research/sidecar-native-tune.m'
      - 'tools/os-integration-research/sidecar-intent-probe.m'
      - 'tools/os-integration-research/sidecar-config-dump.m'
      - 'tools/os-integration-research/display-refresh-probe.m'
      - 'tools/os-integration-research/sidecar-log-monitor.sh'
      - 'tools/os-integration-research/build-tools.sh'
      - '.github/workflows/sidecar-native-tune-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build native Sidecar tuner
        run: |
          tools/os-integration-research/build-tools.sh /tmp/sidecar-tools
          /tmp/sidecar-tools/sidecar-native-tune list
          /tmp/sidecar-tools/sidecar-native-tune --help
