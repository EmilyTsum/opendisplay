name: OS Integration Probe
on:
  workflow_dispatch:
  push:
    branches: [research/os-integration-private-api]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Probe Sidecar AirPlay ControlCenter internals
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe"
          mkdir -p "$OUT"
          sw_vers > "$OUT/sw_vers.txt"
          uname -a > "$OUT/uname.txt"
          targets=(
            /System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore
            /System/Library/PrivateFrameworks/SidecarUI.framework/SidecarUI
            /System/Library/PrivateFrameworks/AirPlaySupport.framework/AirPlaySupport
            /System/Library/PrivateFrameworks/AirPlaySender.framework/AirPlaySender
            /System/Library/PrivateFrameworks/AirPlaySenderKit.framework/AirPlaySenderKit
            /System/Library/CoreServices/AirPlayUIAgent.app/Contents/MacOS/AirPlayUIAgent
            /System/Library/CoreServices/ControlCenter.app/Contents/MacOS/ControlCenter
          )
          for f in "${targets[@]}"; do
            name=$(basename "$f")
            d="$OUT/$name"
            mkdir -p "$d"
            if [[ -e "$f" ]]; then
              file "$f" > "$d/file.txt" || true
              codesign -dvvv --entitlements :- "$f" > "$d/codesign.txt" 2>&1 || true
              otool -L "$f" > "$d/otool-L.txt" 2>&1 || true
              nm -gU "$f" > "$d/nm-global.txt" 2>&1 || true
              strings -a "$f" > "$d/strings-all.txt" || true
              grep -Eai 'sidecar|airplay|mirror|display|device|session|output|continuity|awdl|screen|route|receiver|sender|endpoint|connect' "$d/strings-all.txt" > "$d/strings-filtered.txt" || true
              grep -E '^[_A-Za-z][A-Za-z0-9_.$-]{3,}$|^[+-]\[[^]]+\]$|^[a-zA-Z_][a-zA-Z0-9_]+:$' "$d/strings-all.txt" > "$d/objc-ish.txt" || true
            else
              echo MISSING > "$d/file.txt"
            fi
          done
          # Inventory related frameworks, daemons, launchd units, plug-ins.
          find /System/Library -maxdepth 5 \( -iname '*sidecar*' -o -iname '*airplay*' -o -iname '*screenmirr*' -o -iname '*continuity*display*' \) -print > "$OUT/inventory.txt" 2>/dev/null || true
          launchctl print system 2>/dev/null | grep -Eai -C2 'sidecar|airplay|mirroring' > "$OUT/launchd.txt" || true
      - name: Runtime enumerate Sidecar and AirPlay classes
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/runtime"
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/probe.m" <<'SRC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>
          static BOOL interesting(const char *s) {
            if (!s) return NO;
            NSString *x=[NSString stringWithUTF8String:s].lowercaseString;
            return [x containsString:@"sidecar"] || [x containsString:@"airplay"] ||
                   [x containsString:@"screenmirr"] || [x containsString:@"displaymanager"] ||
                   [x containsString:@"outputdevice"] || [x containsString:@"continuity"];
          }
          int main(void) { @autoreleasepool {
            NSArray *paths=@[
              @"/System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore",
              @"/System/Library/PrivateFrameworks/SidecarUI.framework/SidecarUI",
              @"/System/Library/PrivateFrameworks/AirPlaySupport.framework/AirPlaySupport",
              @"/System/Library/PrivateFrameworks/AirPlaySender.framework/AirPlaySender",
              @"/System/Library/PrivateFrameworks/AirPlaySenderKit.framework/AirPlaySenderKit"
            ];
            for (NSString *p in paths) {
              void *h=dlopen(p.UTF8String, RTLD_LAZY|RTLD_LOCAL);
              printf("DLOPEN\t%s\t%s\n", p.UTF8String, h?"OK":(dlerror()?:"ERR"));
            }
            int count=objc_getClassList(NULL,0);
            Class *classes=(Class *)calloc((size_t)count,sizeof(Class));
            objc_getClassList(classes,count);
            for(int i=0;i<count;i++) {
              Class c=classes[i]; const char *cn=class_getName(c);
              if(!interesting(cn)) continue;
              printf("CLASS\t%s\n",cn);
              unsigned int mc=0; Method *ms=class_copyMethodList(c,&mc);
              for(unsigned int j=0;j<mc;j++) printf("  -[%s %s]\n",cn,sel_getName(method_getName(ms[j])));
              free(ms);
              Class meta=object_getClass(c); mc=0; ms=class_copyMethodList(meta,&mc);
              for(unsigned int j=0;j<mc;j++) printf("  +[%s %s]\n",cn,sel_getName(method_getName(ms[j])));
              free(ms);
            }
            free(classes);
          } return 0; }
          SRC
          clang -fobjc-arc -framework Foundation "$RUNNER_TEMP/probe.m" -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe" > "$OUT/classes-methods.txt" 2>&1 || true
      - name: Safely call Sidecar discovery getters from an unentitled process
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/runtime"
          cat > "$RUNNER_TEMP/sidecar_getters.m" <<'SRC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <dlfcn.h>
          static id call0(id obj, SEL sel) { return ((id(*)(id,SEL))objc_msgSend)(obj,sel); }
          static BOOL callBool0(id obj, SEL sel) { return ((BOOL(*)(id,SEL))objc_msgSend)(obj,sel); }
          int main(void) { @autoreleasepool {
            void *h=dlopen("/System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore", RTLD_LAZY|RTLD_LOCAL);
            printf("dlopen=%s\n",h?"OK":(dlerror()?:"ERR"));
            Class mgr=NSClassFromString(@"SidecarDisplayManager");
            Class dev=NSClassFromString(@"SidecarDevice");
            if (!mgr) { puts("manager_class=nil"); return 0; }
            BOOL supported=callBool0((id)mgr, NSSelectorFromString(@"isSupported"));
            id shared=call0((id)mgr, NSSelectorFromString(@"sharedManager"));
            printf("isSupported=%d shared=%s\n",supported, shared?"OK":"nil");
            for (NSString *name in @[@"devices",@"recentDevices",@"connectedDevices"]) {
              @try {
                id v=call0(shared,NSSelectorFromString(name));
                printf("%s=%s count=%ld desc=%s\n",name.UTF8String,v?object_getClassName(v):"nil",[v respondsToSelector:@selector(count)]?(long)[v count]:-1,[[v description] UTF8String]);
              } @catch(NSException *e) { printf("%s EXCEPTION %s\n",name.UTF8String,e.reason.UTF8String); }
            }
            if (dev) {
              @try { id all=call0((id)dev,NSSelectorFromString(@"allDevices")); printf("SidecarDevice.allDevices count=%ld desc=%s\n",[all respondsToSelector:@selector(count)]?(long)[all count]:-1,[[all description] UTF8String]); }
              @catch(NSException *e) { printf("allDevices EXCEPTION %s\n",e.reason.UTF8String); }
            }
          } return 0; }
          SRC
          clang -fobjc-arc -framework Foundation "$RUNNER_TEMP/sidecar_getters.m" -o "$RUNNER_TEMP/sidecar_getters"
          "$RUNNER_TEMP/sidecar_getters" > "$OUT/sidecar-getters.txt" 2>&1 || true
      - name: Inspect Sidecar relay launch services
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/relay"
          mkdir -p "$OUT"
          for p in \
            /System/Library/LaunchAgents/com.apple.sidecar-relay.plist \
            /System/Library/LaunchAgents/com.apple.sidecar-hid-relay.plist \
            /System/Library/LaunchDaemons/com.apple.AirPlayXPCHelper.plist; do
            [[ -f "$p" ]] || continue
            b=$(basename "$p" .plist)
            cp "$p" "$OUT/$b.plist"
            plutil -p "$p" > "$OUT/$b.txt" || true
            exe=$(defaults read "$p" Program 2>/dev/null || true)
            [[ -z "$exe" ]] && exe=$(plutil -extract Program raw -o - "$p" 2>/dev/null || true)
            if [[ -n "$exe" && -e "$exe" ]]; then
              file "$exe" > "$OUT/$b-file.txt" || true
              codesign -dvvv --entitlements :- "$exe" > "$OUT/$b-codesign.txt" 2>&1 || true
              otool -L "$exe" > "$OUT/$b-otool-L.txt" 2>&1 || true
              strings -a "$exe" | grep -Eai 'sidecar|relay|xpc|service|rapport|device|display|session|connect' > "$OUT/$b-strings.txt" || true
            fi
          done
      - name: Probe Sidecar device status representations
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/runtime"
          cat > "$RUNNER_TEMP/sidecar_status.m" <<'SRC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <dlfcn.h>
          int main(void) { @autoreleasepool {
            dlopen("/System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore", RTLD_LAZY|RTLD_LOCAL);
            Class c=NSClassFromString(@"SidecarDevice");
            if(!c){puts("no SidecarDevice"); return 0;}
            id alloc=((id(*)(id,SEL))objc_msgSend)((id)c,sel_registerName("alloc"));
            id dev=((id(*)(id,SEL,id,id,id))objc_msgSend)(alloc,sel_registerName("initWithIdentifier:model:name:"),[NSUUID UUID],@"iPad13,8",@"OpenDisplay Probe");
            printf("device=%s\n",[[dev description] UTF8String]);
            for(long st=0;st<=12;st++){
              ((void(*)(id,SEL,long))objc_msgSend)(dev,sel_registerName("setStatus:"),st);
              long got=((long(*)(id,SEL))objc_msgSend)(dev,sel_registerName("status"));
              printf("status=%ld desc=%s\n",got,[[dev description] UTF8String]);
            }
          } return 0; }
          SRC
          clang -fobjc-arc -framework Foundation "$RUNNER_TEMP/sidecar_status.m" -o "$RUNNER_TEMP/sidecar_status"
          "$RUNNER_TEMP/sidecar_status" > "$OUT/sidecar-status.txt" 2>&1 || true
      - name: Probe Sidecar display service metadata
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/runtime"
          cat > "$RUNNER_TEMP/sidecar_service.m" <<'SRC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <dlfcn.h>
          static id call0(id obj, const char *sel) { return ((id(*)(id,SEL))objc_msgSend)(obj,sel_registerName(sel)); }
          static long callLong0(id obj, const char *sel) { return ((long(*)(id,SEL))objc_msgSend)(obj,sel_registerName(sel)); }
          int main(void) { @autoreleasepool {
            dlopen("/System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore", RTLD_LAZY|RTLD_LOCAL);
            Class c=NSClassFromString(@"SidecarService_Display");
            if(!c){puts("no class");return 0;}
            id inst=call0(call0((id)c,"alloc"),"init");
            for(const char *sel: (const char*[]){"name","minimumRapportVersion"}) {
              SEL s=sel_registerName(sel); Method m=class_getClassMethod(c,s);
              if(!m) continue;
              const char *enc=method_getTypeEncoding(m);
              if(enc && (enc[0]=='q'||enc[0]=='Q'||enc[0]=='i'||enc[0]=='I')) printf("+%s=%ld enc=%s\n",sel,callLong0((id)c,sel),enc);
              else { id v=call0((id)c,sel); printf("+%s=%s enc=%s\n",sel,[[v description] UTF8String],enc?:""); }
            }
            for(const char *sel: (const char*[]){"serviceIdentifier","serviceExtension","localizedDescription","localizedItemName","symbolName"}) {
              id v=call0(inst,sel); printf("-%s=%s class=%s\n",sel,[[v description] UTF8String],v?object_getClassName(v):"nil");
            }
          } return 0; }
          SRC
          # Objective-C++ for the tiny range-for helper.
          clang++ -x objective-c++ -fobjc-arc -framework Foundation "$RUNNER_TEMP/sidecar_service.m" -o "$RUNNER_TEMP/sidecar_service"
          "$RUNNER_TEMP/sidecar_service" > "$OUT/sidecar-service.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: os-integration-probe
          path: ${{ runner.temp }}/os-probe
