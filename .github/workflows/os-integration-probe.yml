name: OS Integration Probe
on:
  workflow_dispatch:
  push:
    branches: [research/os-integration-private-api]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Probe Sidecar AirPlay ControlCenter internals
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe"
          mkdir -p "$OUT"
          sw_vers > "$OUT/sw_vers.txt"
          uname -a > "$OUT/uname.txt"
          targets=(
            /System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore
            /System/Library/PrivateFrameworks/SidecarUI.framework/SidecarUI
            /System/Library/PrivateFrameworks/AirPlaySupport.framework/AirPlaySupport
            /System/Library/PrivateFrameworks/AirPlaySender.framework/AirPlaySender
            /System/Library/PrivateFrameworks/AirPlaySenderKit.framework/AirPlaySenderKit
            /System/Library/CoreServices/AirPlayUIAgent.app/Contents/MacOS/AirPlayUIAgent
            /System/Library/CoreServices/ControlCenter.app/Contents/MacOS/ControlCenter
          )
          for f in "${targets[@]}"; do
            name=$(basename "$f")
            d="$OUT/$name"
            mkdir -p "$d"
            if [[ -e "$f" ]]; then
              file "$f" > "$d/file.txt" || true
              codesign -dvvv --entitlements :- "$f" > "$d/codesign.txt" 2>&1 || true
              otool -L "$f" > "$d/otool-L.txt" 2>&1 || true
              nm -gU "$f" > "$d/nm-global.txt" 2>&1 || true
              strings -a "$f" > "$d/strings-all.txt" || true
              grep -Eai 'sidecar|airplay|mirror|display|device|session|output|continuity|awdl|screen|route|receiver|sender|endpoint|connect' "$d/strings-all.txt" > "$d/strings-filtered.txt" || true
              grep -E '^[_A-Za-z][A-Za-z0-9_.$-]{3,}$|^[+-]\[[^]]+\]$|^[a-zA-Z_][a-zA-Z0-9_]+:$' "$d/strings-all.txt" > "$d/objc-ish.txt" || true
            else
              echo MISSING > "$d/file.txt"
            fi
          done
          # Inventory related frameworks, daemons, launchd units, plug-ins.
          find /System/Library -maxdepth 5 \( -iname '*sidecar*' -o -iname '*airplay*' -o -iname '*screenmirr*' -o -iname '*continuity*display*' \) -print > "$OUT/inventory.txt" 2>/dev/null || true
          launchctl print system 2>/dev/null | grep -Eai -C2 'sidecar|airplay|mirroring' > "$OUT/launchd.txt" || true
      - name: Runtime enumerate Sidecar and AirPlay classes
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/os-probe/runtime"
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/probe.m" <<'SRC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>
          static BOOL interesting(const char *s) {
            if (!s) return NO;
            NSString *x=[NSString stringWithUTF8String:s].lowercaseString;
            return [x containsString:@"sidecar"] || [x containsString:@"airplay"] ||
                   [x containsString:@"screenmirr"] || [x containsString:@"displaymanager"] ||
                   [x containsString:@"outputdevice"] || [x containsString:@"continuity"];
          }
          int main(void) { @autoreleasepool {
            NSArray *paths=@[
              @"/System/Library/PrivateFrameworks/SidecarCore.framework/SidecarCore",
              @"/System/Library/PrivateFrameworks/SidecarUI.framework/SidecarUI",
              @"/System/Library/PrivateFrameworks/AirPlaySupport.framework/AirPlaySupport",
              @"/System/Library/PrivateFrameworks/AirPlaySender.framework/AirPlaySender",
              @"/System/Library/PrivateFrameworks/AirPlaySenderKit.framework/AirPlaySenderKit"
            ];
            for (NSString *p in paths) {
              void *h=dlopen(p.UTF8String, RTLD_LAZY|RTLD_LOCAL);
              printf("DLOPEN\t%s\t%s\n", p.UTF8String, h?"OK":(dlerror()?:"ERR"));
            }
            int count=objc_getClassList(NULL,0);
            Class *classes=(Class *)calloc((size_t)count,sizeof(Class));
            objc_getClassList(classes,count);
            for(int i=0;i<count;i++) {
              Class c=classes[i]; const char *cn=class_getName(c);
              if(!interesting(cn)) continue;
              printf("CLASS\t%s\n",cn);
              unsigned int mc=0; Method *ms=class_copyMethodList(c,&mc);
              for(unsigned int j=0;j<mc;j++) printf("  -[%s %s]\n",cn,sel_getName(method_getName(ms[j])));
              free(ms);
              Class meta=object_getClass(c); mc=0; ms=class_copyMethodList(meta,&mc);
              for(unsigned int j=0;j<mc;j++) printf("  +[%s %s]\n",cn,sel_getName(method_getName(ms[j])));
              free(ms);
            }
            free(classes);
          } return 0; }
          SRC
          clang -fobjc-arc -framework Foundation "$RUNNER_TEMP/probe.m" -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe" > "$OUT/classes-methods.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: os-integration-probe
          path: ${{ runner.temp }}/os-probe
